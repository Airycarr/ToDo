<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>To Do</title>
<style id="css">
/* Layout: one narrow column, a progress header, then sections as quiet grouped lists with gold check circles */
:root{
  --bg:#f3f4f1;--card:#ffffff;--ink:#1d2024;--muted:#6a6f68;--line:#e1e3dd;
  --gold:#d6a01a;--gold-ink:#ffffff;--gold-soft:#faf0d2;--red:#b3261e;--red-soft:#fbe4e1;--ev:#2c6e9b;--ev-soft:#e3eef6;--ev-ink:#1d4f73;--ev-on:#ffffff;--shadow:rgba(20,22,18,.18);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131513;--card:#1c1f1c;--ink:#ecece6;--muted:#9a9f96;--line:#2d312d;
  --gold:#e6b43a;--gold-ink:#1a1400;--gold-soft:#3a311d;--red:#ff8a80;--red-soft:#3d1f1c;--ev:#7cb6e0;--ev-soft:#1d2c38;--ev-ink:#a9d1ef;--ev-on:#0d1a24;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131513;--card:#1c1f1c;--ink:#ecece6;--muted:#9a9f96;--line:#2d312d;
  --gold:#e6b43a;--gold-ink:#1a1400;--gold-soft:#3a311d;--red:#ff8a80;--red-soft:#3d1f1c;--ev:#7cb6e0;--ev-soft:#1d2c38;--ev-ink:#a9d1ef;--ev-on:#0d1a24;--shadow:rgba(0,0,0,.5);color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:grid;gap:22px}
.scratch{display:grid;gap:8px}
.scratchhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.scratchhead h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.scratchhead span{font-size:12px;color:var(--muted)}
.scratch textarea{display:block;width:100%;box-sizing:border-box;min-height:96px;resize:vertical;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.scratch textarea::placeholder{color:var(--muted)}
.scratch textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.listarea{width:100%;max-width:880px;justify-self:center;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.listcol{display:grid;gap:22px;min-width:0}
.secnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow-y:auto;display:grid;gap:2px;padding:4px 0}
.secnav h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px 10px}
.navitem{display:flex;align-items:center;border-radius:8px;min-width:0}
.navitem:hover{background:var(--card)}
.navitem:hover .navgrip{opacity:.8}
.navitem.on{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.navitem.lifted{opacity:.3}
.navgrip{flex:none;width:20px;height:34px;display:grid;place-items:center;background:none;border:0;padding:0 0 0 4px;color:var(--muted);cursor:grab;touch-action:none;opacity:.35;-webkit-user-select:none;user-select:none;border-radius:6px}
.navgrip svg{width:8px;height:13px}
.navgrip:focus-visible{outline:2px solid var(--gold);opacity:1}
.navph{border:2px dashed var(--gold);border-radius:8px;background:var(--gold-soft);min-height:30px;flex:none}
.ghost.navghost{align-items:center;padding:0;border-radius:8px;font-size:14px}
.navlink{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px 8px 4px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
.navlink span{min-width:0;overflow-wrap:anywhere}
.navlink b{flex:none;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.navlink:hover{color:var(--ink)}
.navitem.on .navlink{color:var(--ink);font-weight:600}
.navitem.on .navlink b{color:var(--gold)}
.navlink:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.listcol section{scroll-margin-top:16px}
section.flash{border-color:var(--gold);transition:border-color .6s}
@media (max-width:980px){
  .listarea{grid-template-columns:minmax(0,1fr);gap:14px;max-width:620px}
  .secnav{top:env(safe-area-inset-top,0px);z-index:5;max-height:none;overflow-x:auto;overflow-y:hidden;display:flex;gap:6px;padding:8px 0;margin-inline:-16px;padding-inline:16px;background:var(--bg);scrollbar-width:none}
  .secnav::-webkit-scrollbar{display:none}
  .secnav h3{display:none}
  .navitem{flex:none;border:1px solid var(--line);border-radius:99px;background:var(--card)}
  .navitem.on{background:var(--ink);box-shadow:none;border-color:var(--ink)}
  .navitem.on .navlink{color:var(--card)}
  .navgrip{height:30px;width:22px;padding-left:6px}
  .navitem.on .navgrip{color:var(--card)}
  .navlink{padding:6px 12px 6px 2px;font-size:13px;white-space:nowrap}
  .navph{min-width:90px;min-height:32px;border-radius:99px}
  .listcol section{scroll-margin-top:64px}
}
body.is-dragging:not(.nav-drag) .secnav{pointer-events:none}
.wrap>*:not(.cal):not(.listarea){width:100%;max-width:620px;justify-self:center;box-sizing:border-box}
/* week planner */
.cal{display:grid;gap:10px;min-width:0}
.calhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 12px}
.calhead h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.calsub{font-size:13px;color:var(--muted);margin:2px 0 0}
.calnav{display:flex;gap:6px;align-items:center}
.calnav .mini{min-width:36px}
.days{display:grid;grid-template-columns:repeat(7,minmax(134px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:150px;display:flex;flex-direction:column;scroll-snap-align:start;min-width:0;transition:border-color .15s,background .15s}
.day.past{background:transparent}
.day.past .dd,.day.past .dn{color:var(--muted)}
.day.over{border-color:var(--gold);background:var(--gold-soft)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px 4px}
.dlabel{display:flex;align-items:baseline;gap:6px}
.dn{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dd{font-family:var(--display);font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.day.today .dd{background:var(--gold);color:var(--gold-ink);border-radius:99px;padding:3px 8px}
.day.today .dn{color:var(--ink)}
.dueflag{font-size:11px;font-weight:600;color:var(--red);white-space:nowrap}
.dlist{display:grid;gap:6px;padding:4px 6px 8px;flex:1;align-content:start}
.dempty{font-size:12px;color:var(--muted);padding:10px 6px;border:1px dashed var(--line);border-radius:8px;text-align:center}
.pchip{display:flex;align-items:flex-start;gap:5px;background:var(--bg);border-radius:8px;padding:5px 4px 3px 0;font-size:13px;line-height:1.3}
.pchip.lifted{display:none}
@media (max-width:700px){.days{grid-template-columns:repeat(7,minmax(150px,1fr))}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-right:4px}
.segb{background:var(--card);border:0;color:var(--muted);font:inherit;font-size:13px;padding:5px 10px;cursor:pointer}
.segb+.segb{border-left:1px solid var(--line)}
.segb.on{background:var(--ink);color:var(--card)}
.segb:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.calnav{flex-wrap:wrap}
.gcstat{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.gcdot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.gcdot.ok{background:var(--ev)}
.gcdot.bad{background:var(--red)}
.gevs{display:grid;gap:4px;padding:2px 6px 2px}
.gev{display:flex;gap:6px;align-items:baseline;min-width:0;text-decoration:none;color:var(--ev-ink);background:var(--ev-soft);border-radius:6px;padding:4px 7px;font-size:12px;line-height:1.3}
.gev b{font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.gev span{min-width:0;overflow-wrap:break-word}
.gev.allday{background:var(--ev);color:var(--ev-on)}
.gev:hover{filter:brightness(.97);text-decoration:underline}
.gev:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mhd{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 4px 2px}
.mcell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:104px;min-width:0;padding:4px;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,background .15s}
.mcell.other{background:transparent;opacity:.6}
.mcell.over{border-color:var(--gold);background:var(--gold-soft)}
.mnum{align-self:flex-start;background:none;border:0;font-family:var(--display);font-weight:700;font-size:15px;line-height:1;padding:3px 6px;border-radius:99px;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.mnum:hover{background:var(--gold-soft)}
.mnum:focus-visible{outline:2px solid var(--gold)}
.mcell.past .mnum{color:var(--muted)}
.mcell.today .mnum{background:var(--gold);color:var(--gold-ink)}
.mlist{padding:0;gap:3px;min-width:0;grid-template-columns:minmax(0,1fr)}
.mchip{min-width:0;overflow:hidden}
.mlist .gev{padding:2px 5px;font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip{padding:2px 5px;gap:4px;font-size:11px;align-items:center;border-radius:6px}
.mchip .ptxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip .pdot{margin-top:0;width:6px;height:6px}
.mchip{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.mchip:hover{box-shadow:inset 0 0 0 1px var(--gold)}
.mchip .ptxt{cursor:grab}
.pchip.mchip.lifted{display:flex;opacity:.35}
button.mmore{background:none;border:0;font:inherit;font-size:11px;text-align:left;cursor:pointer;color:var(--muted)}
button.mmore:hover{color:var(--ink);text-decoration:underline}
.mmore{font-size:11px;color:var(--muted);padding:0 4px}
.mdots{display:none;gap:3px;flex-wrap:wrap;padding:0 4px}
.mdots i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.mdots i.ev{background:var(--ev)}
.mdots i.done{background:var(--line)}
@media (max-width:600px){.mcell{min-height:58px}.mlist{display:none}.mdots{display:flex}.mnum{font-size:13px;padding:3px 5px}}
.bigday{min-height:220px}
.bigday .dh{padding:14px 18px 8px}
.bigday .dd{font-size:34px}
.bigday .dn{font-size:12px}
.dmon{font-family:var(--display);font-weight:600;font-size:20px;color:var(--muted)}
.bigcols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;padding:4px 12px 14px}
.bigcol{display:grid;gap:8px;align-content:start;min-width:0}
.bigh{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 0 4px}
.bigday .dlist{padding:0;gap:8px}
.bigday .pchip{font-size:15px;padding:8px 6px 6px 0;gap:8px}
.bigday .pchip .circ{width:20px;height:20px}
.bigday .pchip .circ svg{width:11px;height:11px}
.bigday .pmeta small{font-size:12px}
.bigday .gevs{padding:0;gap:6px}
.bigday .gev{font-size:14px;padding:8px 10px}
.duelist{display:grid;gap:4px}
.duelink{text-align:left;background:var(--red-soft);color:var(--red);border:0;border-radius:6px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
.dopen{display:flex;background:none;border:0;padding:2px 4px;margin:-2px -4px;border-radius:8px;font:inherit;color:inherit;cursor:pointer}
.dopen:hover{background:var(--gold-soft)}
.dopen:focus-visible{outline:2px solid var(--gold)}
@media (max-width:700px){.bigcols{grid-template-columns:minmax(0,1fr)}}
.navadd{margin-top:6px;text-align:left;background:none;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.navadd:hover{color:var(--ink);border-color:var(--gold)}
.navadd:focus-visible{outline:2px solid var(--gold)}
@media (max-width:980px){.navadd{flex:none;margin-top:0;border-radius:99px;padding:6px 12px;white-space:nowrap}}
.listbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lbhint{font-size:12px;color:var(--muted)}
.mini.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.pick{flex:none;width:30px;height:46px;display:grid;place-items:center;cursor:pointer}
.pick input{width:18px;height:18px;accent-color:var(--gold);cursor:pointer}
li.row.picked{background:var(--gold-soft)}
body.selecting .duerow,body.selecting .moverow,body.selecting .subadd,body.selecting .notes,body.selecting li.row .del,body.selecting .secdesc{display:none}
.actbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:40;width:min(760px,100%);box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -8px 24px var(--shadow);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.actrow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;width:100%;padding-top:10px;border-top:1px solid var(--line)}
.actlab{display:grid;gap:2px;font-size:11px;color:var(--muted);letter-spacing:.04em}
.chip.gcchip{color:var(--ev-ink);border-color:var(--ev);background:var(--ev-soft)}
.chip.gcchip:disabled{opacity:.5}
.mini.gcbtn{background:var(--ev);color:var(--ev-on);border-color:var(--ev)}
.mini.gcbtn:disabled{opacity:.45}
.undo{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--card);border:0;border-radius:99px;padding:10px 16px 10px 13px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px var(--shadow)}
.undo svg{width:15px;height:15px}
.undo:hover{filter:brightness(1.15)}
.undo:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.undo:disabled{opacity:.5;cursor:default}
body.selecting .undo{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
@media (max-width:600px){body.selecting .undo{bottom:calc(200px + env(safe-area-inset-bottom,0px))}}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:60;max-width:min(560px,calc(100% - 32px));box-sizing:border-box;background:var(--ink);color:var(--card);border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 10px 30px var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--red);color:var(--card)}
body.selecting .wrap{padding-bottom:210px}
.actn{font-size:14px;margin-right:4px;font-variant-numeric:tabular-nums}
.actsel{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:100%}
.mini.danger{color:var(--red)}
.mini.danger.armed{background:var(--red);color:var(--card);border-color:var(--red)}
body.selecting .wrap{padding-bottom:140px}
.dph{border:2px dashed var(--gold);border-radius:8px;background:var(--card);min-height:30px}
.day .dph~.dempty,.day.over .dempty{display:none}
.pmove{display:flex;gap:4px;padding:2px 0 2px}
.pmove .mini{padding:2px 8px;font-size:12px}
.pchip .grip{width:16px;height:22px}
.pchip .grip svg{width:8px;height:13px}
.pchip .tick{margin:-4px -4px -4px -6px}
.pchip .circ{width:16px;height:16px;border-width:1.5px;margin-top:0}
.pchip .circ svg{width:9px;height:9px}
.pchip.done .circ{background:var(--gold);border-color:var(--gold)}
.pchip.done .circ svg{opacity:1}
.pbody{flex:1;min-width:0;display:grid}
.pmeta{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:20px}
.pmeta small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ptxt{min-width:0;overflow-wrap:break-word;hyphens:auto;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:4px}
.pchip.done .ptxt span{color:var(--muted);text-decoration:line-through}
.pchip .sdel{width:22px;height:20px;font-size:15px;margin-right:-2px}
.ghost.pghost{display:flex;padding:5px 6px 5px 0;border-radius:8px;font-size:13px;line-height:1.3;gap:6px}
li.row.flash{background:var(--gold-soft);transition:background .6s}
.chip.plan{background:transparent;border-color:var(--gold);color:var(--ink)}
header{display:grid;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;margin:0;text-wrap:balance}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;gap:8px;align-items:center;cursor:pointer;color:var(--ink)}
.toggle input{accent-color:var(--gold);width:18px;height:18px}
.status{font-size:13px;min-height:1em}
.hint{font-size:13px;color:var(--muted);margin:0}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 0 4px;transition:border-color .15s}
section.over{border-color:var(--gold)}
section.dragging{display:none}
.secph{border:2px dashed var(--gold);border-radius:14px;background:var(--gold-soft);height:52px;box-sizing:border-box}
body.sec-drag section>:not(.sh){display:none}
body.sec-drag section{padding-bottom:6px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 16px 4px 4px}
.sh .grip{height:40px}
.shl{flex:1;min-width:0}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.rename{display:inline-flex;gap:8px;align-items:center;background:none;border:0;padding:2px 0;font:inherit;color:inherit;cursor:text;text-align:left;border-radius:6px;max-width:100%}
.rename span{overflow-wrap:anywhere}
.rename svg{flex:none;width:14px;height:14px;color:var(--muted);opacity:.6}
.rename:hover svg{opacity:1}
.hedit{box-sizing:border-box;width:100%;font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--gold);padding:0 0 2px;border-radius:0}
.hedit:focus,.tedit:focus{outline:none}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.count.all{color:var(--gold);font-weight:600}
.secmove{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 16px 8px 34px;font-size:13px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
li.row{display:flex;align-items:flex-start;gap:0;padding-inline:2px 6px;border-top:1px solid var(--line)}
ul.list li.row:first-child{border-top:0}
li.row.dragging{display:none}
li.ph{margin:4px 12px;border:2px dashed var(--gold);border-radius:10px;background:var(--gold-soft);min-height:40px}
.grip{flex:none;width:30px;height:46px;display:grid;place-items:center;background:none;border:0;color:var(--muted);cursor:grab;touch-action:none;border-radius:8px;opacity:.55;padding:0;-webkit-user-select:none;user-select:none}

      var f=el('form','add'); var ai=el('input'); ai.type='text'; ai.id='add-'+sec.id; ai.placeholder='+ Add to '+sec.name; ai.setAttribute('aria-label','Add item to '+sec.name); ai.setAttribute('data-key','a-'+sec.id);
      f.appendChild(ai);
      f.addEventListener('submit',function(e){ e.preventDefault(); var t=ai.value.trim(); if(!t) return; sec.items.push({id:uid(),text:t,done:false,subs:[]}); ai.value=''; render(); schedule(); });
      s.appendChild(f);
      col.appendChild(s);
    });
    var dataRow=el('div','datarow'); dataRow.appendChild(el('span',null,HOSTED?'Backup':'Your list is saved in this browser.'));
    var exB=el('button','clr','Export backup'); exB.type='button'; exB.setAttribute('data-key','export');
    exB.addEventListener('click',function(){
      try{ var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}); var a=document.createElement('a');
        a.href=URL.createObjectURL(blob); a.download='todo-backup-'+iso(new Date())+'.json'; document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500); }catch(e){ toast('Couldn\u2019t export here.',true); }
    });
    var imL=el('label','clr'); imL.appendChild(document.createTextNode('Import backup')); var imI=el('input'); imI.type='file'; imI.accept='application/json,.json'; imI.hidden=true; imI.setAttribute('data-key','import');
    imI.addEventListener('change',function(){ var f=imI.files&&imI.files[0]; if(!f) return; var r=new FileReader();
      r.onload=function(){ try{ var d=JSON.parse(r.result); if(!d||!Array.isArray(d.sections)) throw new Error('bad');
          d.sections.forEach(function(s){ (s.items||(s.items=[])).forEach(function(i){ if(!i.subs) i.subs=[]; }); });
          S=d; render(); schedule(); toast('Backup imported. Use Undo if that wasn\u2019t what you wanted.'); }
        catch(e){ toast('That file isn\u2019t a to-do backup.',true); } };
      r.readAsText(f); });
    imL.appendChild(imI); dataRow.appendChild(exB); dataRow.appendChild(imL);
    var as=el('button','addsec','+ Add section'); as.type='button'; as.setAttribute('data-key','addsec');
    as.addEventListener('click',addSection);
    col.appendChild(as); col.appendChild(dataRow);
    var nadd=el('button','navadd','+ Add section'); nadd.type='button'; nadd.setAttribute('data-key','navadd');
    nadd.addEventListener('click',addSection);
    snav.appendChild(nadd);
    var ub=el('button','undo'); ub.type='button'; ub.id='undo'; ub.innerHTML=UNDO; ub.appendChild(el('span',null,'Undo')); ub.setAttribute('aria-label','Undo last change'); ub.title='Undo last change (Ctrl/Cmd+Z)';
    ub.hidden=!hist.length; ub.disabled=bulkBusy; ub.addEventListener('click',undo);
    root.appendChild(wrap); root.appendChild(ub);
    var strip=root.querySelector('.days');
    if(strip){
      if(calScrolled) strip.scrollLeft=stripX;
      else { calScrolled=true; var td=strip.querySelector('.day.today'); if(td&&strip.scrollWidth>strip.clientWidth) strip.scrollLeft=td.offsetLeft-strip.offsetLeft; else strip.scrollLeft=0; }
    }
    if(Math.abs(window.scrollY-winY)>2) window.scrollTo(0,winY);
    trackNav();
    if(focusAfter){ focusAfter.focus(); if(edit){ try{ var L=focusAfter.value.length; focusAfter.setSelectionRange(L,L); }catch(e){} } }
    else if(key){ var n=root.querySelector('[data-key="'+key+'"]'); if(n){ n.focus(); if(val!=null&&n.tagName==='INPUT'&&key.indexOf('a-')===0&&val) n.value=val; } }
  }

  /* ---------- saving ---------- */
  function buildDoc(){
    var reset=''; var hs=document.head.querySelectorAll('style'); for(var i=0;i<hs.length;i++){ if(hs[i].id!=='css'){ reset=hs[i].textContent; break; } }
    var css=document.getElementById('css').textContent;
    var app=document.getElementById('app').textContent;
    var json=JSON.stringify(S).replace(/</g,'\\u003c');
    var fonts='<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
      '<title>To Do</title>\n<style id="css">'+css+'</style>\n'+fonts+'\n<div id="root"></div>\n'+
      '<script type="application/json" id="state">'+json+'</scr'+'ipt>\n<script id="app">'+app+'</scr'+'ipt></body></html>';
  }
  function busy(){
    if(edit||(drag&&drag.active)) return true;
    var a=document.activeElement; return !!(a&&((a.tagName==='INPUT'&&a.type==='text'&&a.value.trim())||a.tagName==='TEXTAREA'));
  }
  function schedule(skipHist){
    if(!skipHist) record();
    if(readOnly){ setStatus('View only, changes won’t be kept'); return; }
    setStatus('Saving…'); clearTimeout(timer); timer=setTimeout(save,1200);
  }
  function saveLocal(){
    try{ localStorage.setItem(LSKEY, JSON.stringify(S)); setStatus('Saved in this browser'); return true; }
    catch(e){ setStatus('Couldn\u2019t save in this browser. Use Export backup to keep a copy.'); return false; }
  }
  function save(){
    timer=null;
    if(!ready||busy()){ timer=setTimeout(save,800); return; }
    if(!art){ saveLocal(); return; }
    art.publish(buildDoc()).then(function(){ setStatus('Saved'); }, function(e){
      var c=e&&e.code;
      if(c==='not_granted'||c==='not_writer'){ readOnly=true; setStatus('View only, changes won’t be kept'); }
      else if(c==='conflict'){ setStatus('Updated elsewhere, loading the latest'); }
      else setStatus('Couldn’t save. Make another change to retry.');
    });
  }

  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden'&&timer&&!readOnly&&!(drag&&drag.active)){ clearTimeout(timer); timer=null; if(art) art.publish(buildDoc()).catch(function(){}); else saveLocal(); }
  });
  render();
  gcWatch();
  if(window.claude&&window.claude.use){ window.claude.use('artifact').then(function(a){ art=a; ready=true; }, function(){ ready=true; }); }
  else { ready=true; }
})();
</script>
